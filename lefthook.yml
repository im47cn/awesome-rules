# 本仓库自用变体——直接引用 tools/git/lefthook/（单一源，零拷贝漂移）。
# 与分发模板 tools/git/lefthook.yml 的差异仅两类：① 路径（模板用 .lefthook/，
# 由 install.sh 拷贝产物到业务项目）；② 根仓语境注释。闸集合与 wiring 两侧
# 一致：commit-msg/commitmsg / coverage-light / spec-check / coverage-full / tests /
# sourcery-gate / mutation-gate / coderabbit-gate。
# ⚠ 不要对本仓库跑 tools/git/install.sh --update（会用模板覆盖本文件的路径）
# 规范事实源：steering/git-conventions.md + 覆盖率红线「变更行 java ≥98% / python・ts ≥90%，java 全量行/分支 ≥98%」
# 团队成员激活：npm i -g lefthook && lefthook install（或 npm run setup:hooks）
# 占位符 {staged_files}/{push_files} 是触发条件：有对应文件变更才执行（lefthook 2.x 无占位符恒 skip）
commit-msg:
  commands:
    commitmsg:
      run: bash tools/git/lefthook/commitmsg-check.sh {1}

# 覆盖率红线（变更行 java ≥98% / python・ts ≥90%，java 全量行/分支 ≥98%；本仓库无 pyproject/pom/vitest 配置时各分支自动跳过）
pre-commit:
  commands:
    coverage-light:
      run: bash tools/git/lefthook/coverage.sh light {staged_files}
    # spec 条款 <-> 测试反向核对（与分发模板 tools/git/lefthook.yml 一致，仅路径不同）
    spec-check:
      run: bash tools/git/lefthook/spec-check.sh {staged_files}

pre-push:
  # 2026-09-05 决策（@_user_1）: 先跑测试、通过后再跑覆盖率——lefthook 串行执行按
  # 命令名字母序（priority 0/缺省=最后），tests 与 coverage-full 均跑全量 pytest
  # （含 pyproject.toml 的仓 coverage-full 跑 pytest --cov），须 tests 先行；piped 链:
  # tests 失败 → coverage-full 不跑。sourcery/mutation/coderabbit 无依赖走 tier 0。
  piped: true
  commands:

    # 项目自定义测试入口: scripts/pre-push-tests.sh（本仓库私有门禁 = run_tests.sh）
    tests:
      priority: 1
      run: bash tools/git/lefthook/run-tests.sh {push_files}
    coverage-full:
      priority: 2
      run: bash tools/git/lefthook/coverage.sh full {push_files}
    # Sourcery 硬闸: 仓库 opt-in（.sourcery.yaml 存在）才启用（与分发模板一致，仅路径不同）
    sourcery-gate:
      run: bash tools/git/lefthook/sourcery-gate.sh {push_files}
    # 变异分红线: src/main 生产代码变更时按模块跑 PIT（阈值见各模块 pom mutationThreshold，
    # 无 pitest 配置则提示跳过）。本仓无 Java/pom 恒跳过——保留 wiring 与模板闸集合对齐
    # （e26520c 模板增至 5 闸后本文件曾落后 1 闸，头注释「差异仅路径」随之失真）
    mutation-gate:
      run: bash tools/git/lefthook/mutation-gate.sh {push_files}
    # CodeRabbit 建议性评审: 仓库 opt-in（.coderabbit.yaml 存在）才启用，push 时后台 --light 评审已提交变更（异步不阻塞、不拦 push，同分发模板仅路径不同）
    coderabbit-gate:
      run: bash tools/git/lefthook/coderabbit-gate.sh {push_files}
