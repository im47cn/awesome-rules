# CI 治理管线示例 — 架构鹰眼 scan → gate 联邦治理（Phase 3 收官接线）
#
# 三段式管线（对应 arch-hawkeye/requirements.md REQ-A/REQ-D）：
#
#   ┌─ 项目仓库（每个 Java 服务一份）──────────────────────────────┐
#   │ PR:  scan → gate --baseline（增量零容忍 D07）                 │
#   │ push: scan --manifest-only → 归档 manifest（联邦索引 AH-A02）│
#   └──────────────────────────────────────────────────────────────┘
#                     │ 各项目归档的 doc-manifest
#                     ▼
#   ┌─ 中心仓库（awesome-rules 或独立鹰眼仓库）────────────────────┐
#   │ 周期: aggregate（联邦聚合）→ trend / debt 报表（D02/D04/D05）│
#   └──────────────────────────────────────────────────────────────┘
#
# 首次接入三步：
#   1. 各项目 scan 干净工作区产出 manifest → hawkeye.py baseline --name <季度>
#      （存量违规自动登记债务，owner 来自 git blame）
#   2. PR 门禁先跑 --warn-only 灰度（观察 1-2 周，确认无误报）
#   3. 去掉 --warn-only 进入强制（exit 1 阻断新增违规合并）
#
# 本文件为 GitHub Actions 语法示例；Codeup Flow 按相同步骤翻译。
# 用法：项目侧复制到目标 Java 仓库 .github/workflows/；中心侧放
# awesome-rules 或独立仓库。路径按实际布局调整。

# ════════════════════════════════════════════════════════════════════
# 项目仓库侧（每个 Java 服务）
# ════════════════════════════════════════════════════════════════════

name: arch-governance

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

env:
  RULES_PATH: /path/to/awesome-rules            # awesome-rules 检出路径
  DOC_GEN: ${{ format('{0}/skills/doc-gen/scripts/doc_gen.py', '/path/to/awesome-rules') }}
  HAWKEYE: ${{ format('{0}/arch-hawkeye/scripts/hawkeye.py', '/path/to/awesome-rules') }}
  BASELINE_NAME: 2026H2                          # 治理基线名（季度命名）

jobs:
  # ── PR 门禁：增量零容忍（D07）────────────────────────────────────
  # 工作区须干净（CI checkout 天然满足 §6.3 revision 卫生：本地 dirty
  # 快照不进联邦索引；此处只做门禁，不建基线不写 ledger）
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: 检出 awesome-rules（含 doc-gen + 架构鹰眼）
        uses: actions/checkout@v4
        with:
          repository: your-org/awesome-rules
          ref: master
          path: awesome-rules

      - name: 扫描 + 治理门禁
        run: |
          python3 awesome-rules/skills/doc-gen/scripts/doc_gen.py scan . \
            --manifest-only --output /tmp/gov
          python3 awesome-rules/arch-hawkeye/scripts/hawkeye.py gate \
            /tmp/gov/doc-manifest --baseline $BASELINE_NAME --warn-only
          # 灰度期观察无误报后，删除 --warn-only 进入强制阻断（exit 1）

      - name: PR 评论贴趋势摘要（可选）
        if: always()
        run: |
          python3 awesome-rules/arch-hawkeye/scripts/hawkeye.py trend \
            /tmp/gov/doc-manifest --baseline $BASELINE_NAME --json \
            > trend.json
          # 将 trend.json 转为 markdown 附加到 PR（gh pr comment ...）

  # ── master push：归档 manifest（联邦索引 AH-A02 / 增量指纹 AH-A03）──
  # 归档到独立分支 hawkeye-archive，不污染主分支；evidence.revision 即
  # 项目指纹，鹰眼聚合侧按 revision 变更增量重算
  archive:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/checkout@v4
        with:
          repository: your-org/awesome-rules
          ref: master
          path: awesome-rules

      - name: 扫描并归档到 hawkeye-archive 分支
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          git checkout -B hawkeye-archive origin/hawkeye-archive || git checkout --orphan hawkeye-archive
          python3 awesome-rules/skills/doc-gen/scripts/doc_gen.py scan $GITHUB_WORKSPACE \
            --manifest-only --output "$GITHUB_REPOSITORY_NAME/$SHORT_SHA"
          git add . && git -c user.name=arch-hawkeye -c user.email=ci@hawkeye \
            commit -m "archive: $SHORT_SHA" && git push origin hawkeye-archive

# ════════════════════════════════════════════════════════════════════
