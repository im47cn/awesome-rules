# Sourcery 规则保留清单（显式化"评论清零"的边界）。
# 2026-08-31 评审确认：no-loop-in-tests / no-conditionals-in-tests
#   ——测试内循环/条件断言是惯用法，保留。
# 2026-09-01 评审确认：low-code-quality —— 长 main 顺序流程的聚合标签
#   （mutations/run.py 无可操作子建议，拆分收益边际），保留。
# 其余规则全开；新增触发点由 CI gate（sourcery-review-gate.yml）拦截。
version: '1'

ignore:
- .git
- env
- .env
- .tox
- node_modules
- vendor
- venv
- .venv
- dist
- target
- coverage
- StrykerOutput
# evo_replay.py:403 subprocess.run（scorer 执行注册检查器）——sourcery-ai 质量闸
# 标 dangerous-subprocess 为 blocking security；评审论证（sourcery-ai review 第 4 条
# 评论已回复）：subprocess.run 传 list 参数不经 shell（无 shell 注入面）+ script 来自
# scorer_registry 注册表白名单 + input_dir 来自评估集（仓库内路径，非外部可控）。
# 静态规则无法识别该语境，故行级白名单显式化；修复不可行（shlex.escape 会转义合法
# 路径字符，属于 shell 拼接场景的错误用法）。
- skills/skill-evo/scripts/evo_replay.py:403

rule_settings:
  enable:
  - default
  disable:
  - no-loop-in-tests
  - no-conditionals-in-tests
  - low-code-quality
  # test_session 共享 fixture 模块是本仓库测试组织约定（test_gepa/test_evo_cli
  # 共 4 处 import），dont-import-test-modules 规则不适用，迁 conftest 属独立重构。
  - dont-import-test-modules
  rule_types:
  - refactoring
  - suggestion
  - comment
