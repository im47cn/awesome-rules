# doc-gen 模板全链路构建验证：依赖 PR（dependabot）与模板/扫描器改动的真实防线。
# 用 fixtures/cola-sample 跑 scan --build（扫描 → manifest → npm install →
# generate-pages → astro build → pagefind），mermaid/astro 升级是否破坏渲染在此暴露，
# pytest 冒烟（只走 generate-pages）覆盖不到这层。
name: doc-gen build

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "skills/doc-gen/template/**"
      - "skills/doc-gen/scripts/**"
  pull_request:
    paths:
      - "skills/doc-gen/template/**"
      - "skills/doc-gen/scripts/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/doc-gen/template/package-lock.json

      - name: 全链路扫描 + 构建（cola-sample fixture）
        run: |
          python skills/doc-gen/scripts/doc_gen.py scan \
            skills/doc-gen/fixtures/cola-sample --build --output site

      - name: 产物断言
        run: test -f site/dist/index.html && echo "✓ dist/index.html 存在"
