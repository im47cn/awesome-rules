# Sourcery review gate（CI 侧硬闸）。
# 本地 pre-push 钩子（tools/git/lefthook/sourcery-gate.sh）可被 --no-verify 绕过，
# 本 workflow 在 PR 上强制执行同一检查面，无法绕过。
# 语义：对 PR 改动中的语言文件跑 `sourcery review --check --config .sourcery.yaml`。
# 注意：与本地 pre-push 的 push_files 语义不同——本地在 merge 型 PR 上会扫描
# merge 双父 diff 的并集（更宽），CI 只扫 PR 自身的 base...HEAD diff。
# 无语言文件改动时早退 exit 0（保持 required check 兼容：paths 过滤会让
# 不匹配的 PR 永远停在 Expected，故不设 paths，改在步内判断）。
name: sourcery-review-gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 版本与本地 pre-push 对齐（本地 `pip show sourcery` = 1.45.0）。
      # 升级规则集时同步更新本地 pip 与本 pin，避免"本地绿、CI 红"。
      - name: Install sourcery CLI
        run: pip install sourcery==1.45.0
      # 单步内收集文件并直接调用：多行文件列表不能经 GITHUB_OUTPUT 跨步传递
      # （key=value 形式只解析第一行），跨步拆分会导致 gate 只扫第一个文件。
      - name: Run sourcery review on changed language files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          # --diff-filter=d：剔除已删除路径——重命名/删除的旧名在 HEAD 不存在，
          # 直接传给 sourcery 会 "Path does not exist" exit 2（PR #142 .js→.cjs 案例）。
          FILES=$(git diff --name-only --diff-filter=d "${BASE_SHA}"...HEAD -- '*.py' '*.go' '*.java' '*.cs' '*.php' '*.ts' '*.js')
          if [ -z "$FILES" ]; then
            echo "no language files changed, skipping"
            exit 0
          fi
          echo "changed files:"
          echo "$FILES"
          # shellcheck disable=SC2086
          sourcery review --check --config .sourcery.yaml $FILES
