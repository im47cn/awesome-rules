# skill-evo 配置模板 — 复制到 ~/.config/ar/skill-evo/config.toml
# 全部可选：不复制即用默认值（零配置即可用）

# 总开关（等价环境变量 AR_SKILL_EVO_ENABLED=0）
enabled = true

# 用户消息数低于该值的会话跳过（太短无总结价值）
min_messages = 6

# 送入 LLM 的会话视图字符上限
max_transcript_chars = 60000

# omp 会话根目录（其下按 cwd-slug 分子目录）
omp_sessions_dir = "~/.omp/agent/sessions"

# omp 搭车扫描回看天数
omp_lookback_days = 7

# 单次 run 最多处理的 omp 会话数（控制后台 LLM 成本）
omp_max_per_run = 5

# headless 总结 CLI 与超时（秒）
claude_bin = "claude"
claude_timeout = 180

# 只总结 cwd 位于这些目录下的会话
scope_dirs = ["~/sources"]

# 运行数据根目录（proposals/ state.json logs/ evolve/）
base_dir = "~/.config/ar/skill-evo"

# ── GEPA 进化（evo.py evolve）──
# rollout 预算（每次 execute 含提炼+judge 两次 claude -p）
gepa_budget = 16
# 反思 minibatch 大小
gepa_batch_size = 4
# holdout 比例（按会话分层切，holdout ≥4 sessions 才可运行）
gepa_holdout_ratio = 0.2
# 标注样本（applied/rejected 提案）低于此数拒绝进化
gepa_min_cases = 10
# replay 评估集（拦截/放行/混合型 case 总数）低于此数拒绝进化
replay_min_cases = 8
# ── replay 评估升级（pass@k/pass^k 分离 + 双 Agent 多轮 + 调用证据门禁）──
# 单 case 重复采样次数：k>1 时主信号 = pass^k（k 次全过，0/1）；k=1 为单次 F1 旧语义
replay_k = 3
# 双 Agent 多轮：case 目录含 prompts.md 时注入模拟用户回合（无 prompts 零回归）
replay_dual_agent = true
# 调用证据硬门禁：stream 通道解析工具调用流，skill 未真实触发的运行计为失败
replay_evidence = true
# 单次运行通过阈值：F1 ≥ 该值记一次通过
replay_pass_threshold = 1.0
# judge 四维权重：precision / recall / negative_avoidance / format_compliance
judge_weights = [0.35, 0.35, 0.2, 0.1]

# 插件哑故障巡检：两次巡检最小间隔（小时），run 搭车执行
patrol_interval_hours = 6

# apply 幂等检查：语义重复检测阈值（0-1，越高越保守）
idempotent_threshold = 0.8
