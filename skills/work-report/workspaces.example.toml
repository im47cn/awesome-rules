#
# work-report 仓库清单配置
# 拷贝到 ~/.config/ar/workspaces.toml
# 不创建此文件则用默认：扫描 $HOME/sources，author 取各仓库 git config user.email
#

# 多身份过滤（可选）
# 公司账号 + 个人邮箱都算"我的提交"，解决 squash merge 后 author 变 bot 的问题
authors = ["you@corp.com", "you@personal.com"]

# 扫描目录（可选，默认 ["~/sources"]）
# 不显式声明 [[repos]] 时，扫描这些目录下所有 git 仓库（下探 2 层）
scan_dirs = ["~/sources"]

# 扫描时间范围（可选，默认 14；单位天，如 7 = 最近一周、30 = 最近一月）
since = 14

# 排除目录/项目（可选，glob，匹配仓库名或路径片段）
# 用于排除个人项目、第三方 clone、已归档仓库，避免污染工作日报
exclude = ["*/target/*", "*/archive/*"]

# 团队成员映射（TL 团队模式用，email → 姓名）
[[members]]
email = "alice@corp.com"
name = "张三"

# 显式声明仓库 + 业务域（可选）
# 声明后 AI 可按业务域聚类，聚合质量更高
[[repos]]
path = "~/sources/order-service"
domain = "订单域"

[[repos]]
path = "~/sources/pay-service"
domain = "支付域"
