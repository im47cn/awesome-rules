# CI 归档策略示例 — doc-gen manifest 快照归档 + PR 架构演进门禁
#
# 设计要点（对应 docs/design/doc-gen-contract-design.md §8.4）：
# 1. delta 依赖"两份 manifest 都被保留"，归档是 delta 的流程前置
# 2. 归档写入独立分支 doc-gen-archive，不污染主分支工作区
# 3. 目录按短 SHA 命名：<short-sha>/doc-manifest/，manifest 内的
#    evidence.revision 即精确锚点（40 位 SHA），无需外部元数据
# 4. PR 门禁：base 快照（merge-base 对应归档）vs 当前代码生成的快照 →
#    delta.json + delta.md（markdown 可贴 PR comment）
#
# 本文件为 GitHub Actions 语法示例；Codeup Flow 流水线可按相同步骤翻译：
#   源码检出 → python3 doc_gen.py scan . --manifest-only --output <归档路径>
#   → 推送归档分支 / 在 PR 步骤执行 diff 并附加产物
#
# 用法：复制到目标 Java 项目仓库 .github/workflows/archive-manifests.yml，
# 并将 DOC_GEN_PATH 指向 awesome-rules 中 doc-gen 的 scripts 目录。

name: archive-doc-manifest

on:
  push:
    branches: [master, main]

env:
  DOC_GEN_PATH: /path/to/awesome-rules/skills/doc-gen/scripts  # 按实际路径调整
  ARCHIVE_BRANCH: doc-gen-archive

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # diff 的 staleCommits 需要 git 历史

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 manifest 快照（钉定当前 commit）
        run: |
          python3 "$DOC_GEN_PATH/doc_gen.py" scan . \
            --manifest-only --output "archive/$GITHUB_SHA"
          # 输出结构: archive/<40位SHA>/doc-manifest/
          # receipt.json 随 manifest 一并归档（诚实验收记录）

      - name: 推送到归档分支
        run: |
          git config user.name "doc-gen-bot"
          git config user.email "bot@doc-gen"
          git switch -C "$ARCHIVE_BRANCH" || git switch "$ARCHIVE_BRANCH"
          # 只提交归档目录；归档分支允许无历史关联（孤儿分支亦可）
          git add archive/
          git commit -m "chore(doc-gen): archive manifest @ ${GITHUB_SHA:0:12}" \
            || echo "无变化，跳过提交"
          git push origin "$ARCHIVE_BRANCH"

  # ── PR 架构演进门禁（可选 job，与归档配合）─────────────────────────────────
  # 在 PR 中生成 delta 报告：merge-base 的归档快照 vs PR 当前代码快照。
  # "这次重构只动了 adapter 层" 从口头承诺变成 receipt 事实。

  pr-delta:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 取回 base 归档快照
        run: |
          BASE_SHA=$(git merge-base origin/$GITHUB_BASE_REF HEAD)
          git fetch origin "$ARCHIVE_BRANCH" --depth=1
          git checkout "origin/$ARCHIVE_BRANCH" -- "archive/$BASE_SHA" \
            || echo "::warning::base 快照未归档（首次或基线缺失），delta 跳过"

      - name: 生成 PR 当前快照并对比
        run: |
          python3 "$DOC_GEN_PATH/doc_gen.py" scan . \
            --manifest-only --output pr-head
          BASE_SHA=$(git merge-base origin/$GITHUB_BASE_REF HEAD)
          if [ -d "archive/$BASE_SHA/doc-manifest" ]; then
            python3 "$DOC_GEN_PATH/doc_gen.py" diff \
              "archive/$BASE_SHA/doc-manifest" "pr-head/doc-manifest" \
              --output delta.json --markdown delta.md
          fi

      - name: 上传 delta 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-delta
          path: |
            delta.json
            delta.md
          if-no-files-found: ignore
